# GitHub Activity の毎日の取得と確認用 PR（.users/design/activity-pipeline.md §2・§6）
#
# 1. main の最新の状態に、確認用ブランチ（bot/activity）上の手直し（activity.json・除外リスト）を持ち込む
# 2. 作品に紐付く Repository の PR・Release から Activity を生成する
# 3. 変更があれば bot/activity へ push し、確認用 PR を作成（既にあれば本文を更新）する
# 4. 確認用 PR が作成から7日たち、hold ラベルがなければ squash でマージし、続けてデプロイする
#
# GITHUB_TOKEN で作った PR・push では他のワークフロー（ci.yml）が起動しないため、
# フォーマットの確認とビルドはこのワークフローの中で行い、通ったものだけを push する。
#
# 1〜2 と確認（npm の依存パッケージを実行する）は読み取りの権限だけの generate ジョブ、
# 3（git・gh の操作のみ）は書き込みの権限を持つ publish ジョブに分ける。
# 依存パッケージのコードに、push や PR を操作できるトークンを渡さないため。
name: Activity

on:
  schedule:
    # 日本時間 4:00（作業していない時間帯に確認用 PR を更新する）
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

# 確認用ブランチへの push が重ならないよう、同時に1つだけ実行する
concurrency:
  group: activity
  cancel-in-progress: false

env:
  BRANCH: bot/activity

jobs:
  # 1〜2 と確認。npm の依存パッケージのコードを実行するため、書き込みの権限と認証情報を持たせない。
  # 生成したファイルは artifact で publish ジョブへ渡す
  generate:
    name: Generate activity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 収集対象にこの Repository 自身が含まれ、その PR を読むため
      pull-requests: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      # publish ジョブで、確認したものと同じ main のコミットから確認用ブランチを作るため
      base-sha: ${{ steps.restore.outputs.base-sha }}
      review-sha: ${{ steps.restore.outputs.sha }}
    steps:
      # 公開 Repository のため、認証情報がなくても確認用ブランチを fetch できる
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      # 1. 確認用ブランチがあれば、その上の activity.json と除外リストを使う。
      #    ブランチごと引き継がずに main から作り直すのは、main 側の作品・Tech の追加を取り込むため
      #    （確認用ブランチではこの2ファイル以外を変更しない運用。git-workflow.md）
      - name: Restore reviewed files
        id: restore
        run: |
          echo "base-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cp data/activity.json "$RUNNER_TEMP/main-activity.json"
          if git fetch origin "$BRANCH"; then
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            git checkout FETCH_HEAD -- data/activity.json data/activity-excluded.yml
          fi

      # 2. トークンはこのジョブの読み取り専用のもの（公開 Repository の PR・Release の取得にだけ使う）
      - name: Generate activity
        run: npm run activity -- --summary "$RUNNER_TEMP/summary.md" --base "$RUNNER_TEMP/main-activity.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check changes
        id: diff
        env:
          REVIEW_SHA: ${{ steps.restore.outputs.sha }}
        run: |
          # 確認用ブランチ（なければ main）と比べて、Activity が変わったときだけ PR を更新する
          if git diff --quiet "${REVIEW_SHA:-HEAD}" -- data/activity.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm run format:check
          npm run build

      # publish ジョブがコミットする2ファイルと、確認用 PR の本文だけを渡す
      - name: Collect files
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir "$RUNNER_TEMP/activity-update"
          cp data/activity.json data/activity-excluded.yml "$RUNNER_TEMP/summary.md" "$RUNNER_TEMP/activity-update/"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.diff.outputs.changed == 'true'
        with:
          name: activity-update
          path: ${{ runner.temp }}/activity-update/
          if-no-files-found: error
          retention-days: 1

  # 3. git と gh の操作だけを行い、npm・Node のコードは実行しない（書き込みの権限を持つため）。
  #    変更がないときも auto-merge の前提として成功させるため、ジョブではなく各ステップで分岐する
  publish:
    name: Publish review branch
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # 確認用 PR のラベルを作成するため
      issues: write
    env:
      CHANGED: ${{ needs.generate.outputs.changed }}
    steps:
      # bot/activity へ push するため、認証情報を残す（このジョブでは依存パッケージのコードを実行しない）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHANGED == 'true'
        with:
          ref: ${{ needs.generate.outputs.base-sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.CHANGED == 'true'
        with:
          name: activity-update
          path: ${{ runner.temp }}/activity-update

      - name: Push review branch
        if: env.CHANGED == 'true'
        env:
          REVIEW_SHA: ${{ needs.generate.outputs.review-sha }}
        run: |
          cp "$RUNNER_TEMP/activity-update/activity.json" "$RUNNER_TEMP/activity-update/activity-excluded.yml" data/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add data/activity.json data/activity-excluded.yml
          git commit -m 'chore(activity): Activity を更新'
          # 取得した後に人が確認用ブランチを直していた場合は、上書きせずに失敗させる（翌日の実行で取り込まれる）
          git push --force-with-lease="$BRANCH:${REVIEW_SHA}" origin "$BRANCH"

      - name: Create or update pull request
        if: env.CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create activity-update --color FBBF24 --description '確認用の Activity 更新 PR' --force
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$RUNNER_TEMP/activity-update/summary.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(activity): Activity を更新' \
              --label activity-update \
              --body-file "$RUNNER_TEMP/activity-update/summary.md"
          fi

  # 確認期限を過ぎた確認用 PR を公開する（activity-pipeline.md §6.3）。
  # 期限は PR の作成日時から数える（毎日上書きされるため、最終更新日時で数えると永久にマージされない）
  auto-merge:
    name: Auto merge
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVIEW_DAYS: 7
        run: |
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,createdAt,labels --jq '.[0]')
          if [ -z "$pr" ]; then
            echo '確認用 PR はありません'
            exit 0
          fi
          number=$(jq -r .number <<< "$pr")
          if jq -e '.labels | any(.name == "hold")' <<< "$pr" > /dev/null; then
            echo "#$number は hold のため公開しません"
            exit 0
          fi
          age=$(( ($(date +%s) - $(date -d "$(jq -r .createdAt <<< "$pr")" +%s)) / 86400 ))
          if [ "$age" -lt "$REVIEW_DAYS" ]; then
            echo "#$number は作成から ${age} 日（${REVIEW_DAYS} 日で公開）"
            exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN によるマージでは deploy.yml が起動しないため、ここでデプロイする（activity-pipeline.md §7）
  deploy:
    needs: auto-merge
    if: needs.auto-merge.outputs.merged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
