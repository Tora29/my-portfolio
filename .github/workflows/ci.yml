name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format / Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # ブラウザの依存パッケージ（ライブラリ・フォント）が入った Playwright の公式イメージで動かす。
  # ランナー上で --with-deps を使うと毎回 apt でミラーから取得し、ミラーが遅いと10分以上かかるため
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    container:
      # 版は package-lock.json の @playwright/test に合わせる。Dependabot はこのイメージを更新しないため、
      # Playwright を上げたら手で更新する（ずれている間は下の install がブラウザだけを取り直す）
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # ワークスペースの所有者（ランナーのユーザー）と同じ uid で動かす
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # イメージに同じ版のブラウザがあれば何もしない
      - run: npx playwright install chromium
      - run: npm run test:e2e

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ルールの指定は package.json の semgrep スクリプトに集約する
      - run: pipx install semgrep==1.176.0
      - run: npm run semgrep
