<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#06060b" />
  <circle cx="7" cy="8" r="0.9" fill="#fff" opacity="0.7" />
  <circle cx="25.5" cy="6.5" r="0.7" fill="#fff" opacity="0.5" />
  <circle cx="26" cy="25" r="0.8" fill="#34d399" />
  <g transform="rotate(-20 16 16)">
    <!-- 惑星の後ろ側の輪 -->
    <path d="M4 16a12 3.6 0 0 1 24 0" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.55" />
    <circle cx="16" cy="16" r="7" fill="url(#planet)" />
    <!-- 惑星の手前側の輪 -->
    <path d="M4 16a12 3.6 0 0 0 24 0" fill="none" stroke="url(#ring)" stroke-width="1.8" />
  </g>
</svg>
